# Toshiba AC ESPHome configuration - generic ESP32 example.
#
# This is the reference configuration: a minimal ESP32 setup that shows the
# core Toshiba component config plus every optional feature as a commented-out
# line. Copy this file, pick the options you want, and uncomment them.
#
# Target board:
# Generic ESP32 dev board (nodemcu-32s), Arduino framework.
#
# See example_esp32c6_xiao.yaml for a Seeed XIAO ESP32-C6 build with ESP-IDF.
#
# Required secrets (secrets.yaml):
# - wifi_ssid / wifi_password: Wi-Fi credentials
# - device_encryption_key:     32-byte base64 key. Secures the Home Assistant API
#                              connection and, via `ota.encryption:`, the OTA session.
# - ap_password:               password for the fallback captive-portal hotspot

esphome:
  name: "climate-living-room"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source: 
      type: git
      url: https://github.com/dennisvo/esphome_toshiba_suzumi
    components: [toshiba_suzumi]

uart:
  id: uart_bus
  tx_pin: 33
  rx_pin: 32
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: living-room
    id: living_room
    uart_id: uart_bus
    #indoor_temp:        # Optional. Indoor temperature sensor
    #  name: Indoor Temp
    outdoor_temp:        # Optional. Outdoor temperature sensor
      name: Outdoor Temp
    power_select:
      name: "Power level"
    #vertical_air_direction: # Optional. Fixed vertical air direction.
      # Controls the Toshiba horizontal louver, which directs air up/down.
      #name: "Vertical air direction"
    #self_clean:              # Optional. Reports the post-shutdown self-cleaning cycle.
      #name: "Self Clean"
    #horizontal_swing: true # Optional. Uncomment if your HVAC supports also horizontal swing
    #supported_presets:          # Optional. Enable only the features your HVAC
      #- "Standard"
      #- "Hi POWER"
      #- "ECO"
      #- "Fireplace 1"
      #- "Fireplace 2"
      #- "8 degrees"             # When enabling this mode, the temp range is set to 5-30°C
      #- "Silent#1"
      #- "Silent#2"
      #- "Sleep"
      #- "Floor"
      #- "Comfort"
    #disable_wifi_led: true # Optional. Disable Wifi LED on internal unit.

# Enable button to scan for unknown values in AC unit. This is optional.
button:
  - platform: template
    name: "Scan for unknown sensors"
    icon: "mdi:reload"
    on_press:
      then:
         # id(living_room) is the id of the climate component above
        - lambda: |-
            auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
            controller->scan();

# Enable encrypted Home Assistant API.
api:
  encryption:
    key: !secret device_encryption_key

# Encrypted OTA updates. No shared password required - the OTA session key
# is negotiated over the encrypted API connection.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Toshiba-AC-Fallback"
    password: !secret ap_password
